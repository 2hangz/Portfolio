name: Publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: portfolio-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply reviewed portfolio update and recover original assets
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, json, zlib
          files = json.loads(zlib.decompress(base64.b64decode('')))
          if not Path('src/components/SitePreferences.tsx').exists():
              for name, content in files.items():
                  if name.startswith('.github/'):
                      continue
                  path = Path(name)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content)
          PYCODE
          git fetch origin gh-pages
          node scripts/restore-assets.mjs
          git add src scripts next.config.ts tailwind.config.js public/demos public/graphics/storytelling
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update graduate profile, bilingual portfolio and restored demos'
            git push origin HEAD:main
          fi
      - run: npm ci
      - run: npm run build
      - name: Prepare custom-domain export
        run: |
          touch out/.nojekyll
          printf 'hangz.online\n' > out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
